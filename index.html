<body>
<header class="studio"><div><strong>診間支援 · 展示原型</strong><small>獨立模擬資料，操作不會更動實際工作站</small></div></header>
<section class="controls" aria-label="展示控制"><label>展示情境<select id="scenario" disabled><option>00 · 共同入口</option></select></label><label>觀看頁面<select id="view" disabled><option value="home">首頁</option><option value="notifications">實際體驗</option><option value="nurse">護理工作站</option><option value="doctor">醫師端 · 所選診間</option><option value="login">跟診支援登入</option><option value="register">職編註冊</option><option value="analytics">人力分析</option></select></label><label>版面<select id="device" disabled><option value="desktop">電腦 · 寬版</option><option value="phone">手機 · 390px</option></select></label><button disabled id="reset" class="outline">重設此情境</button></section>
<div class="context"><strong id="scene-title"></strong><span id="scene-description"></span></div>
<div id="preview-help" class="alert" style="margin:18px 24px"><strong>目前為靜態預覽</strong>若情境無法切換，代表此附件預覽器未執行互動程式。請下載這份 HTML，再以支援 JavaScript 的瀏覽器開啟。若手機仍只能預覽檔案，需要改用正式網頁網址。</div><div id="stage"><div id="screen"><div class="top"><div class="brand">診間支援</div></div><div class="page"><h1>首頁</h1><nav class="home-menu"><section class="panel"><h2>醫師診間</h2><div class="room-entries"><button disabled>醫師診間 1</button><button disabled>醫師診間 2</button><button disabled>醫師診間 3</button></div></section><button disabled class="entry">跟診支援登入</button><button disabled class="entry outline">人力分析紀錄</button></nav></div></div></div>
<div id="message" role="status" hidden></div>
<dialog id="finish-confirm" aria-labelledby="finish-title"><h2 id="finish-title">確認人員已結束任務？</h2><p id="finish-person"></p><p>通常由承接人員自行結束。請再次確認該人員已完成此診間任務，才由醫師代為解除承接。</p><p class="muted">確認後，診間恢復無需求，人員恢復可接單。</p><form method="dialog"><button value="cancel" class="outline" autofocus>返回，不結束</button><button value="confirm">確認已結束任務</button></form></dialog>
<dialog id="home-confirm" aria-labelledby="home-title"><h2 id="home-title">返回首頁將登出工作站，確定繼續？</h2><p id="home-warning"></p><form method="dialog"><button value="cancel" class="outline" autofocus>取消，留在此頁</button><button value="confirm">登出並返回首頁</button></form></dialog>
<footer class="studio-footer">這是視覺與互動展示；日期、人員與分析數據均為範例。可直接點擊画面中的呼叫、承接、結束等按鈕。</footer>
<script>const PUSH_API='https://push-production-1078.up.railway.app';
let notificationDemo={sequence:0},pipWindow=null,pushBusy=false,pushMessage='',pushConfig=null,swReady=null;
let pushToken='';try{pushToken=localStorage.getItem('clinic-push-device')||'';}catch{}
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const iosDevice=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pushSupported=()=>isSecureContext&&'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window;
const pipSupported=()=>isSecureContext&&'documentPictureInPicture'in window;
const experienceSupported=()=>pushSupported()||pipSupported()||iosDevice();
function resetNotifications(){notificationDemo={sequence:0};if(pipWindow)pipWindow.close();}
function collectNotifications(){syncPip();}
function storePushToken(token){pushToken=token;try{if(token)localStorage.setItem('clinic-push-device',token);else{localStorage.removeItem('clinic-push-device');localStorage.removeItem('clinic-push-job');}}catch{}}
async function pushRequest(path,method='GET',body,token=pushToken){
  const response=await fetch(PUSH_API+path,{method,headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:`Bearer ${token}`}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(12000)});
  const result=await response.json();
  if(!response.ok){if(response.status===401)storePushToken('');throw Error(result.error||'通知服務暫時無法連線');}return result;
}
async function preparePush(){
  if(!pushSupported()||location.protocol==='file:')return;
  try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});swReady=await navigator.serviceWorker.ready;pushConfig=await pushRequest('/config');}
  catch{pushMessage='通知服務暫時無法連線，請重新整理後再試。';}
  if(view==='notifications')render();
}
function notificationPage(){
  const denied=pushSupported()&&Notification.permission==='denied',iosSetup=iosDevice()&&!standalone();
  return heading('實際體驗','真的收到通知，真的開啟置頂小視窗。','TRY IT')+`
  <section class="panel experience"><h2>通知到這台裝置</h2>
  ${iosSetup?'<p>iPhone 請先從瀏覽器選單選「加入主畫面」，再從主畫面開啟此網站。</p>':!pushSupported()?'<p>目前瀏覽器不支援推播通知，請改用支援的瀏覽器開啟線上網站。</p>':denied?'<p>通知已被封鎖，請在瀏覽器或系統設定允許本站通知，再回到這裡。</p>':`<p>${pushToken?'已啟用。按下測試後，請切到其他程式或將手機鎖屏。':'按下啟用並允許通知，即可測試。無需填寫裝置資料。'}</p>${!pushConfig||!swReady?'<p class="muted">尚未連上通知服務。</p>':`<button data-action="real-${pushToken?'test':'enable'}" ${pushBusy?'disabled':''}>${pushBusy?'處理中…':pushToken?'15秒後發送測試通知':'啟用通知'}</button>`}`}
  <p id="push-status" class="muted" role="status">${esc(pushMessage)}</p>
  ${pushToken?'<button class="outline" data-action="real-disable">停止通知並取消待發測試</button>':''}
  <p class="muted">只發送您按下的測試，不會通知其他人。每次間隔至少30秒，體驗訂閱24小時後到期。</p></section>
  ${pipSupported()?`<section class="panel experience"><h2>置頂支援工作站</h2><p>開啟後，切到其他程式仍可看到支援狀態與接單按鈕。診間資料仍是展示資料。</p>${me()?`<button data-action="real-pip">${pipWindow&&!pipWindow.closed?'關閉置頂視窗':'開啟置頂視窗'}</button>`:'<button data-action="real-login">先登入支援工作站</button>'}</section>`:''}
  <button class="outline" data-action="real-back">${me()?'返回工作站':'返回首頁'}</button>`;
}
function bindNotificationControls(){}
async function stopPush(){
  if(pipWindow)pipWindow.close();
  if(!pushToken)return;
  await pushRequest('/subscription','DELETE');storePushToken('');pushMessage='通知已停止，尚未送出的測試已取消。';
  const subscription=await swReady?.pushManager.getSubscription();if(subscription)await subscription.unsubscribe();
}
async function notificationAction(kind){
  if(kind==='real-settings'){view='notifications';render();preparePush();return;}
  if(kind==='real-login'){view='login';render();return;}
  if(kind==='real-back'){if(me()){view='nurse';render();}else{try{await stopPush();returnHome();}catch(e){pushMessage=e.message;render();}}return;}
  if(kind==='real-pip'){
    try{
      if(pipWindow&&!pipWindow.closed){pipWindow.close();return;}
      pipWindow=await documentPictureInPicture.requestWindow({width:350,height:430});
      pipWindow.document.title='支援工作站';
      const style=pipWindow.document.createElement('style');style.textContent='body{font-family:system-ui,sans-serif;background:#f5f7f5;color:#263e39;margin:18px}button{padding:12px;border:0;border-radius:8px;background:#17665b;color:white;margin:5px;cursor:pointer}button:disabled{opacity:.4}h2{font-size:20px}p{line-height:1.5}.pip-room{background:white;padding:10px;border-radius:10px;margin:10px 0}';pipWindow.document.head.append(style);
      pipWindow.addEventListener('pagehide',()=>{pipWindow=null;if(view==='notifications')render();});syncPip();render();
    }catch{pushMessage='無法開啟置頂視窗，請使用支援此功能的電腦瀏覽器。';render();}return;
  }
  if(pushBusy)return;pushBusy=true;
  try{
    if(kind==='real-enable'){
      const permission=await Notification.requestPermission();
      if(permission!=='granted')throw Error('尚未允許通知。');
      const key=Uint8Array.from(atob(pushConfig.publicKey.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
      let subscription=await swReady.pushManager.getSubscription();
      if(subscription){const old=new Uint8Array(subscription.options.applicationServerKey||[]);if(old.length!==key.length||old.some((v,i)=>v!==key[i])){await subscription.unsubscribe();subscription=null;}}
      subscription||=await swReady.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
      const result=await pushRequest('/subscriptions','POST',{subscription:subscription.toJSON()});storePushToken(result.token);pushMessage='已啟用，現在可以安排測試。';
    }
    if(kind==='real-test'){
      const result=await pushRequest('/test','POST',{id:crypto.randomUUID()});
      try{localStorage.setItem('clinic-push-job',result.id);}catch{}
      pushMessage='已安排！15秒後由伺服器發送，現在可以鎖屏或切換程式。';
    }
    if(kind==='real-disable')await stopPush();
  }catch(e){pushMessage=e.message||'操作未完成，請稍後再試。';}
  finally{pushBusy=false;render();}
}
function syncPip(){
  if(!pipWindow||pipWindow.closed)return;
  const n=me();if(!n){pipWindow.close();return;}

  pipWindow.document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
}
async function checkPushStatus(){
  let id;try{id=localStorage.getItem('clinic-push-job');}catch{}
  if(!id||!pushToken)return;
  try{const result=await pushRequest('/test/'+id);pushMessage=({pending:'測試已排程，請稍候。',sending:'正在發送測試。',sent:'推播服務已接受通知；請查看這台裝置的通知中心。',failed:'推播發送失敗，請停止通知後重新啟用。',unknown:'發送結果不明，請先查看通知中心再決定是否重試。',expired:'這次測試已逾時，請重新安排。'})[result.status];if(view==='notifications')render();}catch{}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkPushStatus();});
window.addEventListener('focus',checkPushStatus);
if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='push-open'){view='notifications';render();checkPushStatus();}});

const scenarios=[
  ['home','00 · 共同入口','由首頁進入各診間、支援登入與分析；返回首頁可確認登出。','home'],
  ['idle','01 · 平時：無需求','無待處理診間；登入的1線與2線皆可支援。','nurse'],
  ['waiting','02 · 診間正在等待','3診等待 01:24；可接單者可承接，醫師可取消。','nurse'],
  ['covered','03 · 人員已承接','我的狀態包含承接診間與結束按鈕；醫師可確認後代為結束。','nurse'],
  ['busy','04 · 其他業務忙碌','自己為 BUSY；要先切回可接單才能承接診間。','nurse'],
  ['shortage','05 · 1線全不可用','護理端在我的狀態上方提示；醫師端在診間支援頂欄下方提示。','nurse'],

  ['conflict','07 · 接單被別人搶先','按接單，模擬另一位護理師已先承接的回應。','nurse'],
  ['offline','08 · 連線中斷','顯示最後同步畫面並停用操作；可按恢復連線體驗同步。','nurse'],

  ['register','10 · 註冊新同仁','註冊只建立名冊；手動登入後才出現在人員狀態。','register'],
  ['analytics','11 · 人力分析範例','固定展示數據，供檢視六項指標與圖表呈現。','analytics'],
  ['doctor-finish','12 · 醫師代為結束','醫師查看人力，確認承接人員已結束任務後解除承接。','doctor']
];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state,selected='home',view='home',doctorRoom=3,device='desktop',lastId='N001',lastLine='PRIMARY',toast;
const line=n=>n.line==='PRIMARY'?'1線':'2線';
const me=()=>state.nurses.find(n=>n.id===state.me);
const roomName=id=>`${id}診`;
const personStatus=n=>n.status==='COVERING'?`已承接｜${roomName(n.room)}`:n.status==='BUSY'?'其他業務 · 無法支援':'可接單';
const noAvailablePrimary=()=>state.rooms.some(r=>r.status==='REQUESTING')&&!state.nurses.some(n=>n.logged&&n.line==='PRIMARY'&&n.status==='AVAILABLE');
const shortageCard=doctor=>`<div class="alert shortage-alert" role="status"><strong>⚠️ 目前無可用1線</strong>${doctor?'有診間等待支援，目前1線皆無法支援。':'有診間等待支援，您可以主動承接。'}</div>`;
function notify(text){clearTimeout(toast);$('#message').textContent=text;$('#message').hidden=false;toast=setTimeout(()=>$('#message').hidden=true,5000);}
function setup(key){
  doctorRoom=3;
  selected=key;state={online:true,me:'N001',rooms:[1,2,3].map(id=>({id,status:'IDLE',wait:0,nurse:null})),nurses:[{id:'N001',name:'王怡文',profession:'護理師',line:'PRIMARY',status:'AVAILABLE',room:null,logged:true},{id:'N002',name:'林佳穎',profession:'護理師',line:'PRIMARY',status:'AVAILABLE',room:null,logged:true},{id:'N003',name:'陳志明',profession:'醫檢師',line:'SECONDARY',status:'AVAILABLE',room:null,logged:true},{id:'N004',name:'李雅婷',profession:'行政人員',line:'SECONDARY',status:'AVAILABLE',room:null,logged:true}]};
  const r=state.rooms[2];
  if(['waiting','busy','shortage','multiple','conflict','offline'].includes(key)){r.status='REQUESTING';r.wait=84;}
  if(['covered','doctor-finish'].includes(key)){r.status='COVERED';r.nurse='N001';Object.assign(me(),{status:'COVERING',room:3});}
  if(key==='busy')me().status='BUSY';
  if(key==='shortage'){state.me='N003';state.nurses[0].status='BUSY';Object.assign(state.nurses[1],{status:'COVERING',room:2});Object.assign(state.rooms[1],{status:'COVERED',nurse:'N002'});}
  if(key==='multiple'){Object.assign(state.rooms[1],{status:'REQUESTING',wait:162});}
  if(key==='offline')state.online=false;
  if(['home','login','register'].includes(key)){state.nurses.forEach(n=>n.logged=false);state.me=null;}
  resetNotifications(key);
  view=scenarios.find(s=>s[0]===key)[3];$('#view').value=view;$('#scenario').value=key;$('#message').hidden=true;render();
}
function button(text,action,extra='',disabled=false){return `<button data-action="${action}" class="${extra}" ${disabled||!state.online?'disabled':''}>${text}</button>`;}
function homePage(){return heading('首頁','請選擇要使用的功能。','WELCOME')+`<nav class="home-menu" aria-label="共同入口"><section class="panel"><h2>醫師診間</h2><div class="room-entries">${[1,2,3].map(id=>`<button data-action="open-doctor:${id}">醫師診間 ${id}</button>`).join('')}</div></section><button class="entry" data-action="open-support">跟診支援登入</button><button class="entry outline" data-action="open-analytics">人力分析紀錄</button>${experienceSupported()?'<button class="entry outline" data-action="real-settings">通知與置頂視窗體驗</button>':''}</nav>`;}
function returnHome(){
  const leave=async()=>{try{await stopPush();}catch(e){notify('尚未停止待發通知：'+e.message);return;}const self=me();if(self){lastId=self.id;lastLine=self.line;self.logged=false;state.me=null;}view='home';render();};
  if(!me()){leave();return;}
  const dialog=$('#home-confirm');
  $('#home-warning').textContent=me().room?'登出不會結束目前承接，請先完成任務並結束承接。':'確認後，您將從已登入的人員狀態中移除；再次使用需手動登入。';
  dialog.returnValue='';dialog.onclose=()=>{if(dialog.returnValue==='confirm')leave();};dialog.showModal();
}
function heading(title,subtitle,eyebrow='NURSING STATION'){return `<div class="heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${view==='nurse'&&me()?button('登出工作站','logout','outline'):''}</div>`;}
function workbar(){
  const waiting=state.rooms.filter(r=>r.status==='REQUESTING').length;
  const available=level=>state.nurses.filter(n=>n.logged&&n.line===level&&n.status==='AVAILABLE').length;
  const primary=available('PRIMARY'),secondary=available('SECONDARY');
  return `<header class="workbar"><div class="workmetrics" aria-label="${state.online?'即時人力':'最後同步人力'}"><div class="workmetric" data-metric="waiting"><strong>${waiting}</strong><span>診等待</span></div><div class="workmetric primary-count ${primary===0?'none-available':''}" data-metric="primary"><strong>${primary}<small>人</small></strong><span>1線可支援</span></div><div class="workmetric" data-metric="secondary"><strong>${secondary}<small>人</small></strong><span>2線可支援</span></div></div><div class="worktools"><span class="connection ${state.online?'':'offline'}">${state.online?'● 已連線':'○ 上次同步'}</span>${button('登出','logout','outline')}</div></header>`;
}
function rosterPage(){
  const active=state.nurses.filter(n=>n.logged);
  return `<aside class="personnel"><h2>人員狀態 <small class="muted">僅顯示已登入人員</small></h2>${['PRIMARY','SECONDARY'].map(level=>`<div class="panel roster"><h3>${level==='PRIMARY'?'1線 · 主責人力':'2線 · 支援人力'}</h3>${active.filter(n=>n.line===level).map(n=>`<div class="person"><div class="avatar">${esc(n.name[0])}</div><div><strong>${esc(n.name)}</strong> <span class="tag">${esc(n.profession)}</span><p class="${n.status.toLowerCase()}">${personStatus(n)}</p></div></div>`).join('')||'<p class="muted">目前無人登入</p>'}</div>`).join('')}</aside>`;
}
function myStatus(){const self=me();return `<section class="my-status"><h2>我的狀態</h2><div class="panel"><div class="person"><div class="avatar">${esc(self.name[0])}</div><div><strong>${esc(self.name)}</strong> <span class="tag">${esc(self.profession)}</span> <span class="tag">${line(self)}</span><p class="${self.status.toLowerCase()}">${personStatus(self)}</p></div></div>${self.room?`<div class="assignment"><div><strong>${self.room}診 · 已承接</strong><p>包含準備、移動與服務時間</p></div>${button('結束承接','finish')}</div>`:`<div class="switch">${button('可接單','available',self.status==='AVAILABLE'?'selected':'outline',self.status!=='BUSY')}${button('其他業務 / 忙碌','busy',self.status==='BUSY'?'selected busy':'outline',self.status!=='AVAILABLE')}</div>`}</div></section>`;}
function nursePage(){
  if(!me())return loginPage(false);
  const self=me(),waiting=state.rooms.filter(r=>r.status==='REQUESTING').sort((a,b)=>b.wait-a.wait);
  const shortage=noAvailablePrimary()&&self.line==='SECONDARY';
  return `<h1 class="visually-hidden">護理工作站</h1>
    ${shortage?shortageCard(false):''}
    ${myStatus()}
    ${experienceSupported()?'<p><button class="outline" data-action="real-settings">通知與置頂視窗體驗</button></p>':''}
    ${!state.online?'<div class="alert"><strong>連線中斷 · 正在重新同步</strong>目前為最後同步狀態，恢復連線後才能操作。<p></p><button data-action="reconnect">恢復連線（展示）</button></div>':''}
    <div class="layout"><div class="left"><section class="waiting-rooms"><h2>待處理診間 <span class="tag">${waiting.length}</span></h2>${waiting.length?waiting.map(r=>`<article class="call"><div class="room">${r.id}診</div><div><div class="waiting">等待支援人員</div><div class="timer">${String(Math.floor(r.wait/60)).padStart(2,'0')}:${String(r.wait%60).padStart(2,'0')}</div></div>${button(shortage?'我來支援 →':'接單 →',`accept:${r.id}`,'',self.status!=='AVAILABLE')}</article>`).join(''):'<div class="panel empty"><span>✓</span><h3>目前沒有等待中的診間</h3><p>新的需求會自動出現在這裡</p></div>'}</section></div>${rosterPage()}</div>`;
}
function doctorPage(){const r=state.rooms.find(r=>r.id===doctorRoom),assigned=state.nurses.find(n=>n.id===r.nurse);return heading(`${r.id}診`,'需要支援時，按一下即可通知工作站。','DOCTOR · 固定診間')+`<div class="layout doctor-layout"><div class="panel doctor ${r.status.toLowerCase()}"><span class="tag">${r.id}診</span><div class="symbol">${r.status==='IDLE'?'＋':r.status==='REQUESTING'?'◷':'✓'}</div><h2>${r.status==='IDLE'?'無需求':r.status==='REQUESTING'?'等待支援人員':'已有人承接'}</h2>${r.status==='IDLE'?'<p>工作站已準備接收您的呼叫</p>'+button('呼叫支援人員','request'):r.status==='REQUESTING'?`<div class="timer">${String(Math.floor(r.wait/60)).padStart(2,'0')}:${String(r.wait%60).padStart(2,'0')}</div><p>需求已送出，承接後將即時通知您</p>`+button('取消呼叫','cancel','outline'):`<p class="accepted">${esc(assigned?.name)}（${esc(assigned?.profession)}）已接單</p><p>通常由承接人員結束。若需由醫師代為結束，請先確認任務已完成。</p>`+button('結束承接','doctor-finish','outline')}</div>${rosterPage()}</div>`;}
function loginPage(register){return heading(register?'帳號註冊':'跟診支援登入',register?'註冊職編、姓名與職類；線別於每次登入時選擇。':'選擇本次班別的線別並填寫職編。','WELCOME BACK')+`<section class="panel login"><h2>${register?'註冊職編與姓名':'支援人員身分識別'}</h2><form id="identity">${register?'':`<label>本次線別<select name="line"><option value="PRIMARY" ${lastLine==='PRIMARY'?'selected':''}>1線</option><option value="SECONDARY" ${lastLine==='SECONDARY'?'selected':''}>2線</option></select></label>`}<label>職編<input name="id" value="${register?'':esc(lastId)}" required maxlength="40" pattern="[a-zA-Z0-9_-]{1,40}" placeholder="請填寫職編"></label>${register?'<label>姓名<input name="name" required maxlength="60" placeholder="請填寫姓名"></label><label>職類<select name="profession" required><option>護理師</option><option>醫檢師</option><option>行政人員</option></select></label>':''}<button type="submit">${register?'註冊':'登入工作站'}</button></form><button class="outline" data-action="${register?'show-login':'show-register'}">${register?'返回登入':'尚未註冊？註冊職編與姓名'}</button><p class="muted">預填上次職編與線別，仍需按登入；登入後自動帶入註冊職類。</p><p class="muted">展示職編：N001、N002（護理師）、N003（醫檢師）、N004（行政人員）；皆可依班別選1線或2線</p></section>`;}
function analyticsPage(){return heading('人力配置分析','今日 · 範例數據，非實際統計','STAFFING INSIGHTS')+`<p class="muted">1線主責班段 · 占用包含準備、移動與實際服務</p><div class="metrics">${[['今日跟診占用總時間','2時 40分'],['BUSY 總時間','2時 00分'],['AVAILABLE 總時間','1時 45分'],['等待中位數','1分 12秒'],['最大等待','3分 24秒'],['1線不足總時間','18分 30秒']].map(([l,v])=>`<article class="panel metric"><span>${l}</span><strong>${v}</strong></article>`).join('')}</div><section class="panel graph"><h2>各時段人力分布</h2><div class="legend">承接占用（深綠） · 其他業務（灰褐） · 可接單（淺綠）</div>${['08:00–09:00','09:00–10:00','10:00–11:00'].map((h,i)=>`<p class="muted">${h}</p><div class="proportions"><span style="width:${30+i*12}%"></span><span style="width:${40-i*8}%"></span><span style="width:${30-i*4}%"></span></div>`).join('')}</section><div class="layout"><section class="panel graph"><h2>各診間總占用</h2><div class="bars">${[['1診','35分',40],['2診','1時15分',90],['3診','1時30分',110]].map(([r,d,h])=>`<div class="bar"><div style="--h:${h}px"></div>${r}<p>${d}</p></div>`).join('')}</div></section><section class="panel graph"><h2>1線不足時段</h2><p>09:12–09:20 <span class="tag">8分</span></p><p>10:05–10:15:30 <span class="tag">10分30秒</span></p><p class="muted">有診間等待且1線全不可用的聯合時間。</p></section></div>`;}
function render(){
  collectNotifications();
  const scene=scenarios.find(s=>s[0]===selected);$('#scene-title').textContent=scene[1];$('#scene-description').textContent=scene[2];$('#view').value=view;
  $('#screen').className=device==='phone'?'phone':'';
  const nurseActive=view==='nurse'&&me();
  const top=nurseActive?workbar():`<div class="top"><div class="brand"><span class="mark">＋</span><span>診間支援<small>CLINIC CARE CONNECT</small></span></div><span class="connection ${state.online?'':'offline'}">${['login','register'].includes(view)||view==='nurse'&&!me()?'尚未登入':state.online?'● 即時連線':'○ 連線中斷'}</span></div>`;
  $('#screen').innerHTML=`${top}<div class="page">${view==='doctor'&&noAvailablePrimary()?shortageCard(true):''}${view==='notifications'?notificationPage():view==='home'?homePage():view==='doctor'?doctorPage():view==='analytics'?analyticsPage():view==='login'||view==='register'?loginPage(view==='register'):nursePage()}${view!=='home'?'<footer class="page-footer"><button class="outline" data-action="home">返回首頁</button></footer>':''}</div>`;
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
  bindNotificationControls();
  const form=$('#identity');if(form)form.onsubmit=e=>{
    e.preventDefault();const values=Object.fromEntries(new FormData(form));values.id=values.id.trim();const found=state.nurses.find(n=>n.id===values.id);
    if(view==='register'){
      if(found){notify('此職編已註冊，請直接登入');return;}
      if(!values.name.trim()){notify('請填寫姓名');return;}
      state.nurses.push({id:values.id,name:values.name.trim(),profession:values.profession,line:null,status:'AVAILABLE',room:null,logged:false});lastId=values.id;view='login';render();notify('註冊完成，請按「登入工作站」');
    }else{
      if(!found){notify('此職編尚未註冊');return;}found.line=values.line;
      found.logged=true;state.me=found.id;lastId=found.id;lastLine=found.line;view='nurse';render();
    }
  };
}
function act(action){
  const [kind,id]=action.split(':');const self=me(),r=state.rooms.find(r=>r.id===Number(id))||state.rooms.find(r=>r.id===doctorRoom);
  if(kind.startsWith('real-')){notificationAction(kind,id);return;}
  if(kind==='home'){returnHome();return;}
  if(kind==='open-doctor'){doctorRoom=Number(id);view='doctor';}
  if(kind==='open-support')view=me()?'nurse':'login';
  if(kind==='open-analytics')view='analytics';
  if(kind==='reconnect'){state.online=true;notify('已重新同步，可繼續操作');}
  if(kind==='doctor-finish'){
    const assigned=state.nurses.find(n=>n.id===r.nurse),dialog=$('#finish-confirm');
    $('#finish-person').textContent=`${r.id}診 · ${assigned.name}（${assigned.profession}）`;
    dialog.returnValue='';
    dialog.onclose=()=>{
      if(dialog.returnValue!=='confirm')return;
      if(!state.online||r.status!=='COVERED'||r.nurse!==assigned.id){notify('狀態已變更，請重新確認');return;}
      Object.assign(r,{status:'IDLE',nurse:null,wait:0});Object.assign(assigned,{status:'AVAILABLE',room:null});render();notify('醫師已確認結束承接，人員恢復可接單');
    };
    dialog.showModal();return;
  }
  if(kind==='request'){Object.assign(r,{status:'REQUESTING',wait:0,nurse:null,requestId:++notificationDemo.sequence});notify(`${r.id}診已發出呼叫，可切到護理工作站接單`);}
  if(kind==='cancel')Object.assign(r,{status:'IDLE',wait:0,nurse:null});
  if(kind==='accept'){
    if(selected==='conflict'){Object.assign(r,{status:'COVERED',nurse:'N002'});Object.assign(state.nurses[1],{status:'COVERING',room:r.id});notify('此診間已由其他護理師接手');}
    else{Object.assign(r,{status:'COVERED',nurse:self.id});Object.assign(self,{status:'COVERING',room:r.id});notify('已承接，可切到醫師端查看承接者');}
  }
  if(kind==='finish'){Object.assign(state.rooms.find(r=>r.id===self.room),{status:'IDLE',nurse:null,wait:0});Object.assign(self,{status:'AVAILABLE',room:null});}
  if(kind==='busy')self.status='BUSY';if(kind==='available')self.status='AVAILABLE';
  if(kind==='logout'&&pushToken){stopPush().then(()=>act('logout')).catch(e=>notify('尚未停止待發通知：'+e.message));return;}
  if(kind==='logout'){lastId=self.id;lastLine=self.line;self.logged=false;state.me=null;view='login';}
  if(kind==='show-register')view='register';if(kind==='show-login')view='login';render();
}
$('#scenario').innerHTML=scenarios.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');
$('#scenario').onchange=e=>setup(e.target.value);$('#view').onchange=e=>{if(e.target.value==='home'){returnHome();$('#view').value=view;return;}view=e.target.value;render();};$('#device').onchange=e=>{device=e.target.value;render();};$('#reset').onclick=()=>setup(selected);
setup(selected);
if(new URLSearchParams(location.search).has('experience')){view='notifications';render();}
preparePush();

document.getElementById('preview-help').hidden=true;
document.querySelectorAll('.controls select,.controls button').forEach(element=>element.disabled=false);
if(window.innerWidth<700){device='phone';document.getElementById('device').value=device;render();}
</script></body></html>
