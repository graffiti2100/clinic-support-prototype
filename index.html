.doctor-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:24px;align-items:start}
.doctor-layout .doctor{width:100%;max-width:none;margin:0;text-align:center;padding:35px}
.doctor-layout .doctor .symbol{font-size:52px;color:var(--green);margin:30px 0 22px}
.doctor-layout .doctor h2{font-size:28px}
.doctor-layout .doctor p{color:var(--muted);font-size:14px}
.doctor-layout .doctor button{display:block;width:100%;font-size:20px;min-height:60px;margin-top:27px}
.doctor-layout .doctor .doctor-timer .elapsed{display:block;font-size:58px;color:#a76023;margin:16px}
.doctor-layout .doctor .accepted-name{font-size:21px!important;color:var(--green)!important}
.doctor-layout .doctor.requesting{background:#fffcf6;border-color:#e6c49c}
.doctor-layout>.doctor+section{min-width:0}
.doctor-layout>.doctor+section>.roster-grid{display:grid;grid-template-columns:1fr;gap:14px}

.period-card{padding:24px}
.period-card header p{font-size:13px;color:var(--green);font-weight:700;margin-bottom:5px}
.period-card header h2{font-size:24px;margin-bottom:22px}
.period-card .period-chart{display:flex;align-items:center;gap:24px;padding:0}
.period-card .pie{--support:32%;--busy:73%;width:180px;aspect-ratio:1;border-radius:50%;background:conic-gradient(#237a68 0 var(--support),#a68f72 var(--support) var(--busy),#a9d4b5 var(--busy) 100%);display:grid;place-items:center;position:relative;flex:0 0 auto}
.period-card .pie.no-data{background:#e4e9e6}
.period-card .pie::after{content:"";position:absolute;inset:29%;background:#fff;border-radius:50%}
.period-card .pie span{position:relative;z-index:1;text-align:center;font-size:12px;line-height:1.35;color:#52685d;font-weight:700}
.period-card .pie-legend{margin:0;flex:1;min-width:0;max-width:none}
.period-card .pie-legend>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;margin:0;border-bottom:1px solid var(--line);font-size:13px}
.period-card .pie-legend>div:last-child{border-bottom:0}
.period-card .pie-legend dt{display:flex;align-items:center;gap:8px;font-size:13px}
.period-card .pie-legend dd{margin:0;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.period-card .pie-legend i{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.period-card .pie-legend i.support{background:#237a68}
.period-card .pie-legend i.busy{background:#a68f72}
.period-card .pie-legend i.available{background:#a9d4b5}
.period-card .period-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.period-card .period-metrics>div{text-align:center;padding:8px}
.period-card .period-metrics dt{font-size:12px;color:var(--muted);margin-bottom:8px}
.period-card .period-metrics dd{margin:0;font-size:19px;font-weight:700;color:#304a3c}
.period-card .no-data-note{text-align:center;margin:14px 0 0}
.period-card .sample-count{font-size:11px;text-align:right;margin:12px 0 0}

<script>const PUSH_API='https://push-production-1078.up.railway.app';
let notificationDemo={sequence:0},pipWindow=null,pushBusy=false,pushMessage='',pushConfig=null,swReady=null;
let permissionPending=false;
let cooldownUntil=0,sendDue=0,pushJobStatus='',polling=false,pollUntil=0,preparing=false,pushJobId='',receivedJob='';
let pushToken='';try{pushToken=localStorage.getItem('clinic-push-device')||'';cooldownUntil=Number(localStorage.getItem('clinic-push-cooldown'))||0;}catch{}
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const iosDevice=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pushSupported=()=>isSecureContext&&'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window;
const pipSupported=()=>isSecureContext&&'documentPictureInPicture'in window;
const experienceSupported=()=>pushSupported()||pipSupported()||iosDevice();
function installPipStyles(doc){
  const viewport=doc.createElement('meta');viewport.name='viewport';viewport.content='width=device-width,initial-scale=1';doc.head.append(viewport);
  for(const source of document.querySelectorAll('link[rel="stylesheet"],style')){
    if(source.tagName==='LINK'){const link=doc.createElement('link');link.rel='stylesheet';link.href=source.href;doc.head.append(link);}
    else{const style=doc.createElement('style');style.textContent=source.textContent;doc.head.append(style);}
  }
}
function waitForPushStep(promise,ms=20000){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new DOMException('等待逾時','TimeoutError')),ms);})]).finally(()=>clearTimeout(timer));}
function enablePushError(error,stage){
  const code=/^[A-Za-z]+Error$/.test(error.name||'')?error.name:'Error';
  if(error.status)return `${stage}：${error.message}。可再次按「啟用通知」。`;
  if(stage==='通知權限'){
    if(Notification.permission==='denied')return '瀏覽器回報本站通知已封鎖。請點網址列旁的網站資訊，進入權限／通知並允許。';
    if(code==='TimeoutError')return '尚未收到瀏覽器的權限回覆，通知未啟用。若沒有出現詢問，請點網址列旁的網站資訊查看本站通知權限。';
    return '瀏覽器未授予通知權限，通知未啟用。若沒有出現詢問，請點網址列旁的網站資訊查看本站通知權限。';
  }
  if(stage==='建立推播訂閱'){
    if(code==='NotAllowedError'||/permission denied/i.test(error.message||''))return '建立訂閱遭瀏覽器拒絕。請使用一般瀏覽模式，確認 Android 的 Chrome 通知權限及本站通知權限皆已允許。';
    return `建立推播訂閱失敗（${code}）。可能無法連上瀏覽器推播服務；可切換 Wi-Fi／行動網路後再按「啟用通知」。`;
  }
  return `登記通知裝置失敗（${code}）。訂閱尚未完成登記，請確認網路後再按「啟用通知」；會沿用已建立的瀏覽器訂閱。`;
}
function resetNotifications(){notificationDemo={sequence:0};if(pipWindow)pipWindow.close();}
function collectNotifications(){syncPip();}
function storePushToken(token){pushToken=token;if(!token){cooldownUntil=0;pushJobStatus='';pollUntil=0;}try{if(token)localStorage.setItem('clinic-push-device',token);else{localStorage.removeItem('clinic-push-device');localStorage.removeItem('clinic-push-job');localStorage.removeItem('clinic-push-cooldown');}}catch{}}
async function pushRequest(path,method='GET',body,token=pushToken){
  const response=await fetch(PUSH_API+path,{method,headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:`Bearer ${token}`}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(12000)});
  const result=await response.json();
  if(!response.ok){if(response.status===401)storePushToken('');const error=Error(result.error||'通知服務暫時無法連線');error.status=response.status;throw error;}return result;
}
async function preparePush(){
  if(preparing||!pushSupported()||location.protocol==='file:')return;preparing=true;pushMessage='正在連接通知服務…';updateNotificationControls();
  try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});swReady=await navigator.serviceWorker.ready;pushConfig=await pushRequest('/config');if(pushToken){try{await pushRequest('/subscription');const sub=await swReady.pushManager.getSubscription();if(!sub)storePushToken('');}catch(e){if(e.status!==401)throw e;pushMessage='通知訂閱已到期，請重新啟用。';}}if(!pushMessage.includes('到期'))pushMessage=pushToken?'通知已啟用，可直接測試。':'請先啟用通知並選擇允許。';}
  catch{pushMessage='通知服務暫時無法連線，請重新整理後再試。';}
  preparing=false;updateNotificationControls();checkPushStatus();
}
function updateNotificationControls(){
  const root=document.querySelector('#notification-tools');if(!root)return;
  // Keep the clicked element and focus intact while the native permission UI is open.
  if(permissionPending){const status=root.querySelector('#push-status');if(status)status.textContent=pushMessage;return;}
  const cooling=Math.max(0,Math.ceil((cooldownUntil-Date.now())/1000));
  const denied=pushSupported()&&Notification.permission==='denied',iosSetup=iosDevice()&&!standalone();
  let hint='',action='';
  if(iosSetup)hint='iPhone：加入主畫面並從主畫面開啟後，才能啟用通知。';
  else if(!pushSupported())hint='此環境不支援通知，請以一般瀏覽模式開啟線上網站。';
  else if(denied)hint='通知被封鎖：請在瀏覽器或系統設定允許本站通知。';
  else if(!pushConfig||!swReady)action='<button class="outline" data-action="real-retry">'+(preparing?'連線中…':'重新連接通知服務')+'</button>';
  else action='<button data-action="real-'+(pushToken?'test':'enable')+'" '+(pushBusy||cooling?'disabled':'')+'>'+(pushBusy?'處理中…':cooling?'再等 '+cooling+' 秒':pushToken?'測試通知（4秒後）':'啟用通知')+'</button>';
  const focusedAction=root.contains(document.activeElement)?document.activeElement.dataset.action:null;
  const status=receivedJob&&receivedJob===pushJobId?'這台瀏覽器已收到通知；若未彈出，請查看通知中心及勿擾設定。':pushJobStatus==='pending'&&sendDue>Date.now()?'已排程，約 '+Math.ceil((sendDue-Date.now())/1000)+' 秒後發送。':pushMessage;
  root.innerHTML='<div class="notification-buttons">'+action+(pushToken?'<button class="outline" data-action="real-disable" '+(pushBusy?'disabled':'')+'>停止通知</button>':'')+(pipSupported()?'<button class="outline" data-action="real-pip">'+(pipWindow&&!pipWindow.closed?'關閉置頂視窗':'開啟置頂視窗')+'</button>':'')+'</div><p id="push-status" role="status">'+esc(hint||status||'通知只發到這台裝置；測試間隔30秒。')+'</p>';
  root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>notificationAction(b.dataset.action));
  if(focusedAction)root.querySelector(`[data-action="${focusedAction}"]`)?.focus({preventScroll:true});
}
function bindNotificationControls(){updateNotificationControls();}
async function stopPush(){
  if(pipWindow)pipWindow.close();
  if(!pushToken)return;
  try{await pushRequest('/subscription','DELETE');}catch(e){if(e.status!==401)throw e;}storePushToken('');pushJobId='';pushJobStatus='';cooldownUntil=0;pollUntil=0;pushMessage='通知已停止，尚未送出的測試已取消。';
  const subscription=await swReady?.pushManager.getSubscription();if(subscription)await subscription.unsubscribe();
}
async function notificationAction(kind){
  if(kind==='real-retry'){preparePush();return;}
  if(kind==='real-pip'){
    try{
      if(pipWindow&&!pipWindow.closed){pipWindow.close();return;}
      if(!me()){setup('waiting');pushMessage='已開啟展示工作站，可在小視窗接單。';}
      pipWindow=await documentPictureInPicture.requestWindow({width:430,height:600});
      pipWindow.document.title='診間支援';pipWindow.document.body.className='pip';installPipStyles(pipWindow.document);
      pipWindow.addEventListener('pagehide',()=>{pipWindow=null;updateNotificationControls();});syncPip();render();
    }catch{pushMessage='無法開啟置頂視窗，請使用支援此功能的電腦瀏覽器。';render();}return;
  }
  if(pushBusy||(kind==='real-test'&&Date.now()<cooldownUntil))return;pushBusy=true;let enableStage='通知權限';pushMessage=kind==='real-enable'?'請在瀏覽器詢問時選擇允許…':kind==='real-test'?'正在安排測試…':'正在停止通知…';

    if(kind!=='real-enable')updateNotificationControls();
    if(kind==='real-enable'){
      permissionPending=true;
      const permissionRequest=Notification.permission==='granted'?Promise.resolve('granted'):Notification.requestPermission();

      const permission=await waitForPushStep(permissionRequest,30000);
      permissionPending=false;
      if(permission!=='granted')throw Error('尚未允許通知。');
      enableStage='建立推播訂閱';pushMessage='通知權限已允許，正在建立此瀏覽器的推播訂閱…';updateNotificationControls();

    }

      pushJobId=crypto.randomUUID();try{localStorage.setItem('clinic-push-job',pushJobId);}catch{}

    }

}
function syncPip(){
  if(!pipWindow||pipWindow.closed)return;
  const n=me();if(!n){pipWindow.close();return;}
  const active=state.nurses.filter(person=>person.logged);
  const allBusy=state.rooms.some(r=>r.status==='REQUESTING')&&active.length>0&&active.every(person=>person.status==='BUSY');
  const alert=allBusy?allBusyCard():n.line==='SECONDARY'&&noAvailablePrimary()?shortageCard(false):'';
  pipWindow.document.body.innerHTML=`<header class="pip-heading"><strong>診間支援</strong><span>${state.online?'● 即時連線':'○ 連線中斷'}</span></header>${alert}${myStatus()}${waitingQueue()}${serviceRooms()}${handoffSwitcher()}`;

async function checkPushStatus(){
  if(polling)return;let id;try{id=localStorage.getItem('clinic-push-job');}catch{}
  if(!id||!pushToken)return;
  polling=true;const requestToken=pushToken;try{const result=await pushRequest('/test/'+id);if(requestToken!==pushToken)return;pushJobStatus=result.status;sendDue=result.due;if(result.status==='pending'||result.status==='sending'){cooldownUntil=Math.max(cooldownUntil,result.due+26000);if(!pollUntil)pollUntil=Date.now()+60000;}else pollUntil=0;pushMessage=({pending:'測試已排程，請稍候。',sending:'正在發送測試。',sent:'推播服務已接受通知；請查看這台裝置的通知中心。',failed:'推播發送失敗，請停止通知後重新啟用。',unknown:'發送結果不明，請先查看通知中心再決定是否重試。',expired:'這次測試已逾時，請重新安排。'})[result.status];}catch(e){if(e.status===401){pollUntil=0;pushMessage='訂閱已失效或到期，請重新啟用通知。';}else if(e.status===404){pollUntil=0;pushMessage='未找到測試排程，請重新測試。';}else pushMessage='暫時查不到發送結果，正在重試；請先查看通知中心。';}finally{polling=false;updateNotificationControls();}

document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkPushStatus();});

if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='push-received'){receivedJob=e.data.id;updateNotificationControls();}if(e.data?.type==='push-open'){document.querySelector('#notification-tools')?.scrollIntoView({behavior:'smooth'});checkPushStatus();}});

setInterval(()=>{if(document.hidden)return;if(pollUntil&&pollUntil<=Date.now()){pollUntil=0;pushJobStatus='unknown';pushMessage='目前無法確認發送結果，請查看通知中心後再試。';updateNotificationControls();}if(cooldownUntil>Date.now()-1000||pushJobStatus==='pending')updateNotificationControls();if(pollUntil>Date.now())checkPushStatus();},1000);

const scenarios=[

function act(action){

  if(kind==='home'){returnHome();return;}
  if(kind==='open-doctor'){doctorRoom=Number(id);view='doctor';}
  if(kind==='open-support')view=me()?'nurse':'login';
  if(kind==='open-analytics')view='analytics';
  if(kind==='reconnect'){state.online=true;notify('已重新同步，可繼續操作');}

    const assigned=state.nurses.find(n=>n.id===r.nurse),dialog=$('#finish-confirm');
    $('#finish-person').textContent=`${r.id}診 · ${assigned.name}（${assigned.profession}）`;
    dialog.returnValue='';
    dialog.onclose=()=>{
      if(dialog.returnValue!=='confirm')return;
      if(!state.online||r.status!=='COVERED'||r.nurse!==assigned.id){notify('狀態已變更，請重新確認');return;}
      Object.assign(r,{status:'IDLE',nurse:null,wait:0});Object.assign(assigned,{status:'AVAILABLE',room:null});render();notify('醫師已確認結束承接，人員恢復可接單');
    };

  }

  if(kind==='cancel')Object.assign(r,{status:'IDLE',wait:0,nurse:null});
  if(kind==='accept'){Object.assign(r,{status:'COVERED',nurse:self.id});Object.assign(self,{status:'COVERING',room:r.id});notify('已承接，可切到醫師端查看承接者');}
  if(kind==='finish'){Object.assign(state.rooms.find(r=>r.id===self.room),{status:'IDLE',nurse:null,wait:0});Object.assign(self,{status:'AVAILABLE',room:null});}
  if(kind==='busy')self.status='BUSY';if(kind==='available')self.status='AVAILABLE';
  if(kind==='logout'&&pushToken){stopPush().then(()=>act('logout')).catch(e=>notify('尚未停止待發通知：'+e.message));return;}

    if(r.status!=='COVERED'||r.nurse!==h.from||!from?.logged||!to?.logged||from.room!==r.id||from.status!=='COVERING'||to.status!=='AVAILABLE'||to.room){

  const self=me();if(!self)return '';
  const rooms=state.rooms.filter(r=>r.status==='COVERED');
  const pending=state.rooms.some(r=>r.handoff?.to===self.id);
  return `<section class="services"><h2>服務中的診間</h2>${self.handoffNotice?`<p class="handoff-result" role="status">${esc(self.handoffNotice)}</p>`:''}${rooms.map(r=>{
    const owner=state.nurses.find(n=>n.id===r.nurse),h=r.handoff,applicant=h&&state.nurses.find(n=>n.id===h.to);
    let controls='';
    if(h){
      controls=`<p class="handoff-pending">${esc(applicant.name)}（${line(applicant)}）申請接手，等待 ${esc(owner.name)} 確認。</p>`;
      if(h.from===self.id)controls+=button('接受換手',`handoff-accept:${r.id}:${h.id}`)+button('婉拒',`handoff-decline:${r.id}:${h.id}`,'outline');
      if(h.to===self.id)controls+=button('取消申請',`handoff-cancel:${r.id}:${h.id}`,'outline');
    }else if(owner?.id===self.id)controls='<p>您正在承接此診間</p>';
    else controls=button('申請接手',`handoff-request:${r.id}`,'outline',!self.logged||self.status!=='AVAILABLE'||!!self.room||pending||!owner?.logged);
    return `<article class="panel service-card" data-service-room="${r.id}"><div><h3>${r.id}診</h3><p>${esc(owner?.name)} · ${owner?line(owner):''} · ${esc(owner?.profession)}${owner&&!owner.logged?'（未登入）':''}</p></div><div class="handoff-actions">${controls}</div></article>`;
  }).join('')||'<div class="panel compact muted">目前沒有服務中的診間</div>'}</section>`;
}
function handoffAction(action){
  const [kind,roomId,token]=action.split(':'),r=state.rooms.find(r=>r.id===Number(roomId)),self=me();
  if(!state.online||!self?.logged||!r)return;
  pruneHandoffs();
  const owner=state.nurses.find(n=>n.id===r.nurse),h=r.handoff;
  if(kind==='handoff-request'){
    if(r.status!=='COVERED'||!owner?.logged||owner.status!=='COVERING'||owner.room!==r.id||owner.id===self.id||self.status!=='AVAILABLE'||self.room||h||state.rooms.some(room=>room.handoff?.to===self.id)){render();notify('目前無法申請，請確認人員與診間狀態。');return;}
    r.handoff={id:crypto.randomUUID(),from:owner.id,to:self.id};self.handoffNotice='';owner.handoffNotice='';
  }else{
    if(!h||h.id!==token){render();notify('這筆換手申請已失效，請查看最新狀態。');return;}
    const applicant=state.nurses.find(n=>n.id===h.to);
    if(kind==='handoff-cancel'&&h.to===self.id){self.handoffNotice=`已取消${r.id}診換手申請。`;owner.handoffNotice=`${applicant.name}已取消${r.id}診換手申請。`;delete r.handoff;}
    else if(kind==='handoff-decline'&&h.from===self.id){self.handoffNotice=`已婉拒${r.id}診換手申請，您繼續承接。`;applicant.handoffNotice=`${owner.name}已婉拒${r.id}診換手申請。`;delete r.handoff;}
    else if(kind==='handoff-accept'&&h.from===self.id){
      Object.assign(owner,{status:'AVAILABLE',room:null,handoffNotice:`${r.id}診已交由${applicant.name}承接，您已恢復可接單。`});
      Object.assign(applicant,{status:'COVERING',room:r.id,handoffNotice:`換手完成，您已接手${r.id}診。`});
      r.nurse=applicant.id;delete r.handoff;
    }
  }
  render();
}
const handoffCss='.service-rooms{margin:20px 0}.service-rooms h2{font-size:18px}.service-room{background:#fff;border:1px solid #bdd1d9;border-radius:10px;padding:14px;margin:10px 0;overflow-wrap:anywhere}.service-room>strong{color:#1e3a8a}.service-room p{font-size:14px;line-height:1.5;margin:8px 0}.handoff-actions button{margin:4px 6px 4px 0;font-size:14px}.handoff-pending,.handoff-result{background:#eff6ff;color:#1e3a8a;padding:10px;border-radius:8px;line-height:1.5}.handoff-demo{display:block;background:#edf1ee;padding:12px;border-radius:8px;margin:16px 0;font-size:12px}.handoff-demo select{box-sizing:border-box;display:block;width:100%;max-width:100%;font:inherit;padding:10px;margin-top:8px;border:1px solid #b8c8be;border-radius:6px;background:white;color:#263e39}';
const handoffStyle=document.createElement('style');handoffStyle.textContent=handoffCss;document.head.append(handoffStyle);
$('#scenario').innerHTML=scenarios.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');
$('#scenario').onchange=e=>setup(e.target.value);$('#view').onchange=e=>{if(e.target.value==='home'){returnHome();$('#view').value=view;return;}view=e.target.value;render();};$('#device').onchange=e=>{device=e.target.value;render();};$('#reset').onclick=()=>setup(selected);
document.addEventListener('click',event=>{const settings=$('.demo-settings');if(settings?.open&&!settings.contains(event.target)){settings.open=false;event.preventDefault();event.stopPropagation();}},true);
setup(selected);
setInterval(updateWaitingTimes,1000);
document.addEventListener('visibilitychange',updateWaitingTimes);
preparePush();

document.getElementById('preview-help').hidden=true;
document.querySelectorAll('.controls select,.controls button').forEach(element=>element.disabled=false);
if(window.innerWidth<700){device='phone';document.getElementById('device').value=device;render();}
</script></body></html>
